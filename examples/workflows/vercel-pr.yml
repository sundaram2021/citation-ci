name: Published documentation links
on: pull_request
permissions:
  contents: read
  # Uncomment together with pr-comment below to publish findings on the PR.
  # pull-requests: write
concurrency:
  group: published-links-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  published-links:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check links published on the default branch
        uses: sundaram2021/citation-ci@9f75b6bc0e7a21719d6ba105152ecf0a2a880c6e
        with:
          production: ${{ vars.DOCS_PRODUCTION_ORIGIN }}
          source-repo: ${{ vars.LINK_SOURCE_REPO || github.repository }}
          source-path: README.md
          source-token: ${{ github.token }}
          vercel-project: ${{ vars.VERCEL_PROJECT_ID }}
          vercel-team: ${{ vars.VERCEL_TEAM_ID }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          commit: ${{ github.event.pull_request.head.sha }}
          mode: report
          # pr-comment: 'true'

name: Citation CI
description: Check published documentation links against a deployment preview
inputs:
  production:
    description: Production origin that owns the citations
    required: true
  preview:
    description: Preview origin for this exact revision, instead of Vercel discovery
    required: false
  file:
    description: CSV or newline-delimited inventory in the caller workspace
    required: false
  source-repo:
    description: GitHub owner/repo whose default branch publishes links (instead of file)
    required: false
  source-path:
    description: Optional Markdown file or directory within source-repo
    required: false
  source-token:
    description: GitHub contents-read token for the source API
    required: false
  vercel-project:
    description: Vercel project ID for preview discovery
    required: false
  commit:
    description: Exact PR head SHA for preview discovery
    required: false
  vercel-token:
    description: Token to read deployments on Vercel
    required: false
  vercel-team:
    description: Team ID for a team-owned Vercel project
    required: false
  parent-moves:
    description: JSON object mapping an exact citation path and query to its accepted parent destination
    required: false
  error-page-marker:
    description: Case-sensitive literal unique to the site's HTML error template
    required: false
  pr-comment:
    description: Update a summary comment on same-repository pull requests
    default: 'false'
  mode:
    description: 'enforce fails on regressions or inconclusive results; report surfaces findings without blocking'
    default: enforce
outputs:
  exit-code:
    description: 'Checker exit code: 0 clean, 1 regression, 2 inconclusive or error'
    value: ${{ steps.compare.outputs.exit-code }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install pinned checker dependencies
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH" --omit=dev --ignore-scripts --no-audit --no-fund
    - name: Compare citation destinations
      id: compare
      shell: bash
      env:
        WANT_COMMENT: ${{ inputs.pr-comment == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        CITATION_PRODUCTION: ${{ inputs.production }}
        CITATION_PREVIEW: ${{ inputs.preview }}
        CITATION_FILE: ${{ inputs.file }}
        PARENT_MOVES: ${{ inputs.parent-moves }}
        ERROR_PAGE_MARKER: ${{ inputs.error-page-marker }}
        SOURCE_REPO: ${{ inputs.source-repo }}
        SOURCE_PATH: ${{ inputs.source-path }}
        GH_SOURCE_TOKEN: ${{ inputs.source-token }}
        VERCEL_PROJECT: ${{ inputs.vercel-project }}
        VERCEL_TEAM_ID: ${{ inputs.vercel-team }}
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        COMMIT_SHA: ${{ inputs.commit }}
      run: |
        args=(--production "$CITATION_PRODUCTION")
        if [[ -n "$CITATION_PREVIEW" ]]; then args+=(--preview "$CITATION_PREVIEW"); fi
        if [[ -n "$CITATION_FILE" ]]; then args+=(--file "$CITATION_FILE"); fi
        if [[ -n "$SOURCE_REPO" ]]; then args+=(--source-repo "$SOURCE_REPO"); fi
        if [[ -n "$SOURCE_PATH" ]]; then args+=(--source-path "$SOURCE_PATH"); fi
        if [[ -n "$VERCEL_PROJECT" ]]; then args+=(--vercel-project "$VERCEL_PROJECT"); fi
        if [[ -n "$COMMIT_SHA" ]]; then args+=(--commit "$COMMIT_SHA"); fi
        if [[ -n "$PARENT_MOVES" ]]; then args+=(--parent-moves "$PARENT_MOVES"); fi
        if [[ -n "$ERROR_PAGE_MARKER" ]]; then args+=(--error-page-marker "$ERROR_PAGE_MARKER"); fi
        if [[ "$WANT_COMMENT" == true ]]; then
          export CITATION_COMMENT_FILE="$(mktemp "$RUNNER_TEMP/citation-comment.XXXXXX")"
          echo "comment-file=$CITATION_COMMENT_FILE" >> "$GITHUB_OUTPUT"
        fi
        code=0
        node "$GITHUB_ACTION_PATH/src/cli.ts" "${args[@]}" || code=$?
        printf 'exit-code=%s\n' "$code" >> "$GITHUB_OUTPUT"
    - name: Update PR comment
      if: steps.compare.outputs.comment-file != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPORT_FILE: ${{ steps.compare.outputs.comment-file }}
        COMPLETE: ${{ steps.compare.outputs.comparison-complete }}
      run: |
        node "$GITHUB_ACTION_PATH/scripts/pr-comment.mjs" || echo "::warning::Citation CI could not update its PR comment. See the job summary and check pull-requests write permission."
        rm -f "$REPORT_FILE"
    - name: Apply check policy
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        COMPLETE: ${{ steps.compare.outputs.comparison-complete }}
        CODE: ${{ steps.compare.outputs.exit-code }}
      run: |
        case "$MODE" in
          report) if [[ "$COMPLETE" == true ]]; then exit 0; fi ;;
          enforce) ;;
          *) printf 'Expected mode report or enforce\n' >&2; exit 2 ;;
        esac
        exit "$CODE"

name: Test Citation CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code -- dist/
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo
      - name: Start production and preview fixtures
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/live" "$RUNNER_TEMP/preview"
          printf '<h1 id="keys">Create an API key</h1>' > "$RUNNER_TEMP/live/auth.html"
          printf '<h1>Authentication</h1>' > "$RUNNER_TEMP/preview/auth.html"
          python3 -m http.server 43111 --bind 127.0.0.1 --directory "$RUNNER_TEMP/live" > "$RUNNER_TEMP/live.log" 2>&1 &
          python3 -m http.server 43112 --bind 127.0.0.1 --directory "$RUNNER_TEMP/preview" > "$RUNNER_TEMP/preview.log" 2>&1 &
          for port in 43111 43112; do
            curl --silent --show-error --fail --retry 8 --retry-connrefused "http://127.0.0.1:$port/auth.html" > /dev/null
          done
          printf 'http://127.0.0.1:43111/auth.html#keys\n' > "$RUNNER_TEMP/citations.txt"
      - name: Check preview with missing anchor
        id: broken
        continue-on-error: true
        uses: ./
        with:
          production: http://127.0.0.1:43111
          preview: http://127.0.0.1:43112
          file: ${{ runner.temp }}/citations.txt
      - name: Report findings without blocking rollout
        id: reported
        uses: ./
        with:
          production: http://127.0.0.1:43111
          preview: http://127.0.0.1:43112
          file: ${{ runner.temp }}/citations.txt
          mode: report
      - name: Report mode must not mask an invalid inventory
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          production: http://127.0.0.1:43111
          preview: http://127.0.0.1:43112
          file: ${{ runner.temp }}/missing.txt
          mode: report
      - name: Assert outcomes and restore the cited section
        env:
          OUTCOME: ${{ steps.broken.outcome }}
          EXIT_CODE: ${{ steps.broken.outputs.exit-code }}
          REPORT_CODE: ${{ steps.reported.outputs.exit-code }}
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
          INVALID_CODE: ${{ steps.invalid.outputs.exit-code }}
        run: |
          test "$OUTCOME" = failure
          test "$EXIT_CODE" = 1
          test "$REPORT_CODE" = 1
          test "$INVALID_OUTCOME" = failure && test "$INVALID_CODE" = 2
          cp "$RUNNER_TEMP/live/auth.html" "$RUNNER_TEMP/preview/auth.html"
      - name: Check repaired preview
        uses: ./
        with:
          production: http://127.0.0.1:43111
          preview: http://127.0.0.1:43112
          file: ${{ runner.temp }}/citations.txt
